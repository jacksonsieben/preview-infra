---
# The github_runner settings: instance names, labels and slices, with and
# without github_runners, the check that they do not collide, and the tool
# cache default for each scope. Offline: no API call,
# nothing changed, and group_vars/all/local.yml is not read.
#
#   ansible-playbook tests/github_runner_settings.yml
#
# Task vars stand in for local.yml; they win over the defaults of vars_files.

- name: GitHub Actions runner settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/defaults.yml
    - ../roles/github_runner/defaults/main.yml
  tasks:
    - name: Check the instances of two repositories
      ansible.builtin.assert:
        that:
          - github_runner_wanted == expected
          - github_runner_names_unique | bool
        fail_msg: "Instances: {{ github_runner_wanted }}"
      vars:
        github_runner_repos: [you/app.web, you/api]
        github_runner_instances: 2
        expected:
          you-app.web-1: repos/you/app.web
          you-app.web-2: repos/you/app.web
          you-api-1: repos/you/api
          you-api-2: repos/you/api

    - name: Check the instances of an organization
      ansible.builtin.assert:
        that:
          - "github_runner_wanted == {'acme-1': 'orgs/acme', 'acme-2': 'orgs/acme'}"
          - github_runner_names_unique | bool
        fail_msg: "Instances: {{ github_runner_wanted }}"
      vars:
        github_runner_scope: org
        github_runner_org: acme
        github_runner_repos: [you/ignored]
        github_runner_instances: 2

    - name: Check that colliding names are refused
      ansible.builtin.assert:
        that:
          - not github_runner_names_unique | bool
        fail_msg: "{{ item }} was accepted: {{ github_runner_wanted }}"
      vars:
        github_runner_repos: "{{ item }}"
      loop:
        - [a-b/c, a/b-c]
        - [you/app, you/app]
        - [You/App, you/app]

    - name: Check that a config without github_runners keeps its instances and slice
      ansible.builtin.assert:
        that:
          - "github_runner_wanted == {'you-app-1': 'repos/you/app'}"
          - "github_runner_instance_settings['you-app-1'] == expected"
          - github_runner_child_slices == []
          - github_runner_lookup_repos == ['you/app']
        fail_msg: "Instances: {{ github_runner_instance_settings }}"
      vars:
        github_runner_repos: [you/app]
        expected:
          target: repos/you/app
          labels: [self-hosted, linux, x64, preview-host]
          slice: github_runner.slice

    - name: Check several runners per repository
      ansible.builtin.assert:
        that:
          - github_runner_instance_settings == expected
          - github_runner_names_unique | bool
          - github_runner_lookup_repos == ['owner/example']
          - github_runner_child_slices | map(attribute='slice') | list == expected_slices
          - github_runner_child_slices | map(attribute='cpu_quota') | list == ['', '50%']
          - github_runner_child_slices | map(attribute='memory_max') | list == ['', '2G']
        fail_msg: "Instances: {{ github_runner_instance_settings }}"
      vars:
        github_runner_labels: [self-hosted, linux, ARM64, ci-1]
        github_runners:
          - {repo: owner/example, name: heavy, labels: [ci-heavy]}
          - {repo: owner/example, name: light, labels: [ci-light], instances: 2,
             cpu_quota: 50%, memory_max: 2G}
        expected_slices:
          - github_runner-owner_example_heavy.slice
          - github_runner-owner_example_light.slice
        expected:
          owner-example-heavy-1:
            target: repos/owner/example
            labels: [self-hosted, linux, ARM64, ci-1, ci-heavy]
            slice: github_runner-owner_example_heavy.slice
          owner-example-light-1:
            target: repos/owner/example
            labels: [self-hosted, linux, ARM64, ci-1, ci-light]
            slice: github_runner-owner_example_light.slice
          owner-example-light-2:
            target: repos/owner/example
            labels: [self-hosted, linux, ARM64, ci-1, ci-light]
            slice: github_runner-owner_example_light.slice

    - name: Check that colliding runners of the list are refused
      ansible.builtin.assert:
        that:
          - not github_runner_names_unique | bool
        fail_msg: "{{ item }} was accepted: {{ github_runner_instance_settings }}"
      vars:
        github_runners: "{{ item }}"
      loop:
        - [{repo: you/app, name: light}, {repo: you/app, name: light}]
        - [{repo: you/app, name: light}, {repo: You/App, name: light}]
        - [{repo: a-b/c, name: x}, {repo: a/b-c, name: x}]
        - [{repo: a.b/c, name: x}, {repo: a_b/c, name: x}]

    - name: Render the slice of a light runner
      ansible.builtin.assert:
        that:
          - "'CPUQuota=50%' in rendered"
          - "'MemoryMax=2G' in rendered"
          - "'MemorySwapMax=0' in rendered"
          - "'owner-example-light' in rendered"
        fail_msg: "{{ rendered }}"
      vars:
        rendered: >-
          {{ lookup('ansible.builtin.template',
                    '../roles/github_runner/templates/github_runner-child.slice.j2',
                    template_vars={'item': {'base': 'owner-example-light', 'cpu_quota': '50%',
                                            'memory_max': '2G'}}) }}

    - name: Render the slice of a runner without limits of its own
      ansible.builtin.assert:
        that:
          - "'CPUQuota' not in rendered"
          - "'MemoryMax=' not in rendered"
        fail_msg: "{{ rendered }}"
      vars:
        rendered: >-
          {{ lookup('ansible.builtin.template',
                    '../roles/github_runner/templates/github_runner-child.slice.j2',
                    template_vars={'item': {'base': 'owner-example-heavy', 'cpu_quota': '',
                                            'memory_max': ''}}) }}

    - name: Check that the tool cache is emptied for every job with org only
      ansible.builtin.assert:
        that:
          - github_runner_tool_cache_max_gb | int == item.max
        fail_msg: "Scope {{ item.scope }}: {{ github_runner_tool_cache_max_gb }} GB"
      vars:
        github_runner_scope: "{{ item.scope }}"
      loop:
        - {scope: repo, max: 5}
        - {scope: org, max: 0}

    - name: Check that the runners are off unless turned on
      ansible.builtin.assert:
        that:
          - not github_runner_enabled
          - github_runner_wanted == {}

    # site.yml hands ci-1's settings to the role as github_runner_* (and
    # ci_host_runners as github_runners); one left
    # out would silently take the preview host's value on ci-1.
    - name: Check that the ci play maps every ci_host_runner setting
      ansible.builtin.assert:
        that:
          - mapped | length > 0
          - mapped == expected
        fail_msg: "github_runner vars of the ci play: {{ mapped }}"
      vars:
        plays: "{{ lookup('ansible.builtin.file', '../site.yml') | from_yaml }}"
        ci_play: "{{ plays | selectattr('hosts', 'eq', 'ci') | first }}"
        mapped: >-
          {{ (ci_play.roles | select('mapping') | selectattr('role', 'eq', 'github_runner')
              | first).vars }}
        settings: >-
          {{ (lookup('ansible.builtin.file', '../group_vars/all/defaults.yml') | from_yaml).keys()
             | select('match', '^ci_host_runner(_|s$)') | list }}
        expected: >-
          {{ dict(settings | map('regex_replace', '^ci_host_runner', 'github_runner')
                  | zip(settings | map('regex_replace', '^(.*)$', '{{ \1 }}'))) }}

    - name: Check ci-1's runner defaults
      ansible.builtin.assert:
        that:
          - not ci_host_runner_enabled
          - "'ARM64' in ci_host_runner_labels"
          - "'x64' not in ci_host_runner_labels"
          - "'ci-1' in ci_host_runner_labels"
          - ci_host_runners == []
        fail_msg: "Labels: {{ ci_host_runner_labels }}"

    # The ci_2 play (README, Second CI host (ci-2)): one ci-light slot for
    # private repositories, ARM64 only, no Docker in jobs unless turned on,
    # and a job bridge that ci_host's firewall knows.
    - name: Check the ci_2 play
      ansible.builtin.assert:
        that:
          - ci_2_play.hosts == 'ci_2'
          - ci_2_roles == ['ci_host', 'github_runner']
          - runner.github_runner_instances == 1
          - runner.github_runners == []
          - runner.github_runner_scope == 'repo'
          - runner.github_runner_org == ''
          - runner.github_runner_bridge_prefix == ci_host.ci_host_job_bridge_prefix
          - runner.github_runner_dns == ci_host.ci_host_job_dns
          - runner.github_runner_docker is search('ci_2_runner_docker')
          - not ci_2_runner_docker
          - not ci_2_runner_enabled
          - ci_2_address == ''
          - ci_2_runner_repos == []
          - ci_2_runner_memory_max == '4G'
          - "'ci-light' in ci_2_runner_labels and 'ARM64' in ci_2_runner_labels"
          - ci_2_runner_labels | map('lower') | intersect(['x64', 'x86', 'amd64']) == []
          - ci_2_play.vars.ci_2_job_bridge_prefix is match('^[a-z][a-z0-9-]{0,6}$')
          # ci-1's play is left as it was: ci-2 is not in its group.
          - ci_play.hosts == 'ci'
        fail_msg: "{{ ci_2_play | to_json }}"
      vars:
        plays: "{{ lookup('ansible.builtin.file', '../site.yml') | from_yaml }}"
        ci_play: "{{ plays | selectattr('hosts', 'eq', 'ci') | first }}"
        ci_2_play: "{{ plays | selectattr('hosts', 'eq', 'ci_2') | first }}"
        ci_2_roles: "{{ ci_2_play.roles | map(attribute='role') | list }}"
        runner: "{{ (ci_2_play.roles | selectattr('role', 'eq', 'github_runner') | first).vars }}"
        ci_host: "{{ (ci_2_play.roles | selectattr('role', 'eq', 'ci_host') | first).vars }}"

    - name: Check that ci-2 is in its own inventory group
      ansible.builtin.assert:
        that:
          - "'ci-2' in inventory.all.children.ci_2.hosts"
          - "'ci-2' not in (inventory.all.children.ci.hosts | default({}))"
        fail_msg: "{{ inventory | to_json }}"
      vars:
        inventory: "{{ lookup('ansible.builtin.file', '../inventory/hosts.yml') | from_yaml }}"

    # ci-1 and the preview host: no named bridge, no resolvers of its own.
    - name: Render the compose file without job network settings
      ansible.builtin.assert:
        that:
          - rendered is not search('networks:')
          - rendered is not search('dns:')
          - rendered is not search('RUNNER_BRIDGE_ID')
        fail_msg: "{{ rendered }}"
      vars:
        rendered: "{{ lookup('ansible.builtin.template', '../roles/github_runner/templates/compose.yml.j2') }}"

    - name: Render ci-2's compose file
      ansible.builtin.assert:
        that:
          - parsed.services.runner.dns == ['1.1.1.1', '9.9.9.9']
          - parsed.networks.default.driver_opts['com.docker.network.bridge.name'] == 'ghr-${RUNNER_BRIDGE_ID:?}'
          - "'docker' not in parsed.services"
          - parsed.volumes is not defined
          - rendered is not search('docker.sock:/var/run/docker.sock')
        fail_msg: "{{ rendered }}"
      vars:
        github_runner_docker: false
        github_runner_bridge_prefix: ghr-
        github_runner_dns: [1.1.1.1, 9.9.9.9]
        rendered: "{{ lookup('ansible.builtin.template', '../roles/github_runner/templates/compose.yml.j2') }}"
        parsed: "{{ rendered | from_yaml }}"

    - name: Render ci-2's compose file with Docker in jobs
      ansible.builtin.assert:
        that:
          - parsed.services.docker.network_mode == 'service:runner'
          - parsed.volumes.keys() | list | length > 0
          - parsed.networks.default.driver_opts['com.docker.network.bridge.name'] == 'ghr-${RUNNER_BRIDGE_ID:?}'
        fail_msg: "{{ rendered }}"
      vars:
        github_runner_docker: true
        github_runner_bridge_prefix: ghr-
        github_runner_dns: [1.1.1.1]
        rendered: "{{ lookup('ansible.builtin.template', '../roles/github_runner/templates/compose.yml.j2') }}"
        parsed: "{{ rendered | from_yaml }}"
