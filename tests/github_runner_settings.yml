---
# The github_runner settings: instance names, the check that they do not
# collide, and the tool cache default for each scope. Offline: no API call,
# nothing changed, and group_vars/all/local.yml is not read.
#
#   ansible-playbook tests/github_runner_settings.yml
#
# Task vars stand in for local.yml; they win over the defaults of vars_files.

- name: GitHub Actions runner settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/defaults.yml
    - ../roles/github_runner/defaults/main.yml
  tasks:
    - name: Check the instances of two repositories
      ansible.builtin.assert:
        that:
          - github_runner_wanted == expected
          - github_runner_names_unique | bool
        fail_msg: "Instances: {{ github_runner_wanted }}"
      vars:
        github_runner_repos: [you/app.web, you/api]
        github_runner_instances: 2
        expected:
          you-app.web-1: repos/you/app.web
          you-app.web-2: repos/you/app.web
          you-api-1: repos/you/api
          you-api-2: repos/you/api

    - name: Check the instances of an organization
      ansible.builtin.assert:
        that:
          - "github_runner_wanted == {'acme-1': 'orgs/acme', 'acme-2': 'orgs/acme'}"
          - github_runner_names_unique | bool
        fail_msg: "Instances: {{ github_runner_wanted }}"
      vars:
        github_runner_scope: org
        github_runner_org: acme
        github_runner_repos: [you/ignored]
        github_runner_instances: 2

    - name: Check that colliding names are refused
      ansible.builtin.assert:
        that:
          - not github_runner_names_unique | bool
        fail_msg: "{{ item }} was accepted: {{ github_runner_wanted }}"
      vars:
        github_runner_repos: "{{ item }}"
      loop:
        - [a-b/c, a/b-c]
        - [you/app, you/app]
        - [You/App, you/app]

    - name: Check that the tool cache is emptied for every job with org only
      ansible.builtin.assert:
        that:
          - github_runner_tool_cache_max_gb | int == item.max
        fail_msg: "Scope {{ item.scope }}: {{ github_runner_tool_cache_max_gb }} GB"
      vars:
        github_runner_scope: "{{ item.scope }}"
      loop:
        - {scope: repo, max: 5}
        - {scope: org, max: 0}

    - name: Check that the runners are off unless turned on
      ansible.builtin.assert:
        that:
          - not github_runner_enabled
          - github_runner_wanted == {}

    # site.yml hands ci-1's settings to the role as github_runner_*; one left
    # out would silently take the preview host's value on ci-1.
    - name: Check that the ci play maps every ci_host_runner setting
      ansible.builtin.assert:
        that:
          - mapped | length > 0
          - mapped == expected
        fail_msg: "github_runner vars of the ci play: {{ mapped }}"
      vars:
        plays: "{{ lookup('ansible.builtin.file', '../site.yml') | from_yaml }}"
        ci_play: "{{ plays | selectattr('hosts', 'eq', 'ci') | first }}"
        mapped: >-
          {{ (ci_play.roles | select('mapping') | selectattr('role', 'eq', 'github_runner')
              | first).vars }}
        settings: >-
          {{ (lookup('ansible.builtin.file', '../group_vars/all/defaults.yml') | from_yaml).keys()
             | select('match', '^ci_host_runner_') | list }}
        expected: >-
          {{ dict(settings | map('regex_replace', '^ci_host_runner_', 'github_runner_')
                  | zip(settings | map('regex_replace', '^(.*)$', '{{ \1 }}'))) }}

    - name: Check ci-1's runner defaults
      ansible.builtin.assert:
        that:
          - not ci_host_runner_enabled
          - "'ARM64' in ci_host_runner_labels"
          - "'x64' not in ci_host_runner_labels"
          - "'ci-1' in ci_host_runner_labels"
        fail_msg: "Labels: {{ ci_host_runner_labels }}"
