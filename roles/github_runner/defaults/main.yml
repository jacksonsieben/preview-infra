---
github_api: https://api.github.com

# GitHub's own runner image. `latest` follows GitHub, which stops sending jobs
# to runners that fall too far behind; a daily timer pulls it again. Pin a tag
# (e.g. ghcr.io/actions/actions-runner:2.330.0) or a digest (...@sha256:...)
# for reproducible rebuilds.
github_runner_image: ghcr.io/actions/actions-runner:latest
github_runner_dind_image: docker:dind
github_runner_update_schedule: "*-*-* 04:30"

# A job's network: empty, compose's default bridge (br-<id>). Set, a bridge
# named <prefix><8 hex digits> that ci_host's nftables rules keep to the
# internet (README, Second CI host (ci-2)). At most 7 characters: a Linux
# interface name has 15.
github_runner_bridge_prefix: ""
# The resolvers of a job's containers; empty, Docker's choice (the host's).
github_runner_dns: []

# The `runner` user and `docker` group inside github_runner_image.
github_runner_uid: 1001
github_runner_docker_gid: 123

# How often a running runner checks again that its repository is private (or
# that the organization's runner group refuses public ones), idle or not.
github_runner_visibility_check_seconds: 300

# Runner group for scope org. Group 1 is the organization's default group.
github_runner_group_id: 1

# Runner names on GitHub: <prefix>-<instance>-<time>.
github_runner_name_prefix: "{{ inventory_hostname }}"

github_runner_config_dir: /etc/github-runner
github_runner_data_dir: /var/lib/github-runner
# systemd slice that holds every runner and job, with the shared limits.
github_runner_slice: github_runner.slice

# The runner groups: github_runners as given or, without it, one group per
# target of github_runner_scope with github_runner_repos/org,
# github_runner_instances and github_runner_labels, as before github_runners.
# A group of github_runners gets its own systemd slice inside
# github_runner_slice, with its own limits: github_runner-<owner>_<repo>_<name>.slice.
github_runner_targets: >-
  {{ ['orgs/' ~ github_runner_org] if github_runner_scope == 'org'
     else github_runner_repos | map('regex_replace', '^', 'repos/') | list }}
github_runner_groups: >-
  {%- set ns = namespace(items=[]) -%}
  {%- if github_runners | length > 0 -%}
  {%- for r in github_runners -%}
  {%- set base = (r.repo | default('') | replace('/', '-')) ~ '-' ~ (r.name | default('')) -%}
  {%- set ns.items = ns.items + [{
        'base': base,
        'target': 'repos/' ~ (r.repo | default('')),
        'instances': r.instances | default(1) | int,
        'labels': (github_runner_labels + (r.labels | default([]) | list)) | unique | list,
        'slice': 'github_runner-' ~ (base | lower | regex_replace('[^a-z0-9]', '_')) ~ '.slice',
        'cpu_quota': r.cpu_quota | default('') | string,
        'memory_max': r.memory_max | default('') | string}] -%}
  {%- endfor -%}
  {%- else -%}
  {%- for target in github_runner_targets -%}
  {%- set ns.items = ns.items + [{
        'base': target.split('/', 1)[1] | replace('/', '-'),
        'target': target,
        'instances': github_runner_instances | int,
        'labels': github_runner_labels,
        'slice': github_runner_slice,
        'cpu_quota': '',
        'memory_max': ''}] -%}
  {%- endfor -%}
  {%- endif -%}
  {{ ns.items }}

# One entry per systemd instance (github-runner@<name>.service): its target,
# labels and slice. <name> is <owner>-<repo>-<n>, or <owner>-<repo>-<runner>-<n>
# with github_runners.
github_runner_instance_settings: >-
  {%- set ns = namespace(items={}) -%}
  {%- for group in github_runner_groups -%}
  {%- for n in range(1, group.instances + 1) -%}
  {%- set ns.items = ns.items | combine({group.base ~ '-' ~ n: {
        'target': group.target, 'labels': group.labels, 'slice': group.slice}}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ ns.items }}
github_runner_wanted: >-
  {{ dict(github_runner_instance_settings.keys()
          | zip(github_runner_instance_settings.values() | map(attribute='target'))) }}

# The slices of github_runners' groups, inside github_runner_slice.
github_runner_child_slices: >-
  {{ github_runner_groups | rejectattr('slice', 'eq', github_runner_slice) | list }}

# The private repositories the runners serve, checked before they start.
github_runner_lookup_repos: >-
  {{ github_runner_groups | map(attribute='target') | select('match', '^repos/')
     | map('regex_replace', '^repos/', '') | unique | list }}

# Instance names drop the slash and their compose projects the case, so a-b/c
# and a/b-c, A/b and a/b, or a repository listed twice, would share one. The
# slices of github_runners also drop dots and dashes.
github_runner_names_unique: >-
  {{ github_runner_wanted.keys() | map('lower') | unique | list | length
     == github_runner_groups | map(attribute='instances') | sum
     and github_runner_child_slices | map(attribute='slice') | unique | list | length
     == github_runner_child_slices | length }}
