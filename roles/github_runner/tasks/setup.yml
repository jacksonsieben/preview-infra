---
- name: Check the runner settings
  ansible.builtin.assert:
    that:
      - github_runner_scope in ['repo', 'org']
      - github_runner_scope != 'repo' or github_runner_repos | length > 0
      - github_runner_repos | reject('match', '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') | list | length == 0
      - github_runner_scope != 'org' or github_runner_org is match('^[A-Za-z0-9-]+$')
      - github_runner_instances | int >= 1
      - github_runner_labels | length > 0
    fail_msg: >-
      Set github_runner_scope to repo with github_runner_repos (owner/name), or
      to org with github_runner_org, and github_runner_instances to 1 or more
      (README, GitHub Actions runner).
    quiet: true

- name: Check the runner token
  ansible.builtin.assert:
    that:
      - github_runner_token | length > 0
    fail_msg: >-
      Set GITHUB_RUNNER_TOKEN or github_runner_token_ref (README, GitHub
      Actions runner).
    quiet: true
  no_log: true

# Public repositories are refused here, and again by github-runner-job before
# every registration, in case one is made public later. A pull request from a
# fork of a public repository would run anyone's code on this host.
- name: Look up the repositories
  ansible.builtin.uri:
    url: "{{ github_api }}/repos/{{ item }}"
    headers: &github_headers
      Authorization: "Bearer {{ github_runner_token }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    status_code: [200, 401, 403, 404]
  loop: "{{ github_runner_repos if github_runner_scope == 'repo' else [] }}"
  register: github_runner_repo_lookup
  no_log: true

- name: Refuse public repositories
  ansible.builtin.assert:
    that:
      - item.status == 200
      - item.json.private
      - item.json.visibility | default('private') == 'private'
    fail_msg: >-
      {{ item.item }} is not a private repository, or the token cannot read it
      (HTTP {{ item.status }}). The runner only serves private repositories.
    quiet: true
  loop: "{{ github_runner_repo_lookup.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Look up the organization's runner group
  ansible.builtin.uri:
    url: "{{ github_api }}/orgs/{{ github_runner_org }}/actions/runner-groups/{{ github_runner_group_id }}"
    headers: *github_headers
    status_code: [200, 401, 403, 404]
  register: github_runner_group_lookup
  when: github_runner_scope == 'org'
  no_log: true

- name: Refuse a runner group open to public repositories
  ansible.builtin.assert:
    that:
      - github_runner_group_lookup.status == 200
      - not github_runner_group_lookup.json.allows_public_repositories
    fail_msg: >-
      Runner group {{ github_runner_group_id }} of {{ github_runner_org }}
      allows public repositories, or the token cannot read it (HTTP
      {{ github_runner_group_lookup.status }}). Turn off "Allow public
      repositories" in the organization's Actions → Runner groups.
    quiet: true
  when: github_runner_scope == 'org'

# The runners' containers go into a systemd slice that holds the limits, which
# Docker supports only with its systemd cgroup driver.
- name: Read Docker's cgroup driver
  ansible.builtin.command:
    cmd: docker info --format {% raw %}'{{ .CgroupDriver }}'{% endraw %}
  register: github_runner_cgroup_driver
  changed_when: false

- name: Check Docker's cgroup driver
  ansible.builtin.assert:
    that:
      - github_runner_cgroup_driver.stdout == 'systemd'
    fail_msg: >-
      Docker uses the {{ github_runner_cgroup_driver.stdout }} cgroup driver;
      the runner limits need systemd (exec-opts native.cgroupdriver=systemd in
      /etc/docker/daemon.json).
    quiet: true

- name: Create the runner directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ github_runner_config_dir }}", mode: "0700" }
    - { path: "{{ github_runner_data_dir }}", mode: "0755" }

# Read by github-runner-job for every job, so it stays on the host, readable by
# root only.
- name: Write the runner token
  ansible.builtin.copy:
    content: "{{ github_runner_token }}\n"
    dest: "{{ github_runner_config_dir }}/token"
    mode: "0600"
  no_log: true

- name: Write the runner settings
  ansible.builtin.copy:
    content: "{{ github_runner_settings | to_nice_json }}\n"
    dest: "{{ github_runner_config_dir }}/config.json"
    mode: "0644"
  vars:
    github_runner_settings:
      api: "{{ github_api }}"
      instances: "{{ github_runner_wanted }}"
      labels: "{{ github_runner_labels }}"
      runner_group_id: "{{ github_runner_group_id | int }}"
      name_prefix: "{{ github_runner_name_prefix }}"
      data_dir: "{{ github_runner_data_dir }}"
      uid: "{{ github_runner_uid | int }}"
      min_free_disk_gb: "{{ github_runner_min_free_disk_gb | int }}"
      tool_cache_max_gb: "{{ github_runner_tool_cache_max_gb | int }}"

- name: Write the runner compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ github_runner_config_dir }}/compose.yml"
    mode: "0644"

- name: Install the runner scripts
  ansible.builtin.copy:
    src: github-runner-job
    dest: /usr/local/bin/github-runner-job
    mode: "0755"

- name: Install the runner image update script
  ansible.builtin.template:
    src: github-runner-update.j2
    dest: /usr/local/bin/github-runner-update
    mode: "0755"

- name: Install the runner units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - "{{ github_runner_slice }}"
    - github-runner@.service
    - github-runner-update.service
    - github-runner-update.timer
  notify: Reload systemd for the runners

- name: Pull the runner images
  ansible.builtin.command:
    cmd: "docker pull {{ item }}"
  loop: "{{ [github_runner_image] + ([github_runner_dind_image] if github_runner_docker else []) }}"
  register: github_runner_pull
  changed_when: "'Downloaded newer image' in github_runner_pull.stdout"

- name: Apply systemd changes before starting the runners
  ansible.builtin.meta: flush_handlers

- name: Enable the runner image update timer
  ansible.builtin.systemd_service:
    name: github-runner-update.timer
    enabled: true
    state: started

- name: Start the runners
  ansible.builtin.systemd_service:
    name: "github-runner@{{ item }}.service"
    enabled: true
    state: started
  loop: "{{ github_runner_wanted.keys() | list }}"
