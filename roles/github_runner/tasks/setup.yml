---
- name: Check the runner settings
  ansible.builtin.assert:
    that:
      - github_runner_scope in ['repo', 'org']
      - github_runner_scope != 'repo' or github_runner_repos | length > 0 or github_runners | length > 0
      - github_runner_repos | reject('match', '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') | list | length == 0
      - github_runner_scope != 'org' or github_runner_org is match('^[A-Za-z0-9-]+$')
      - github_runner_instances | int >= 1
      - github_runner_labels | length > 0
    fail_msg: >-
      Set github_runner_scope to repo with github_runner_repos (owner/name), or
      to org with github_runner_org, and github_runner_instances to 1 or more
      (README, GitHub Actions runner).
    quiet: true

# github_runners replaces github_runner_repos and github_runner_instances;
# with both set, one of them would be ignored without a word.
- name: Check the list of runners
  ansible.builtin.assert:
    that:
      - github_runners is sequence and github_runners is not string
      - github_runners | length == 0 or github_runner_scope == 'repo'
      - github_runners | length == 0 or github_runner_repos | length == 0
    fail_msg: >-
      github_runners (ci_host_runners on ci-1) is a list of repository runners
      and replaces github_runner_repos and github_runner_instances: with it,
      leave github_runner_repos (ci_host_runner_repos) empty and the scope
      repo (README, Several runners per repository).
    quiet: true

- name: Check each runner of the list
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.repo | default('') is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - item.name | default('') is match('^[a-z0-9_]+$')
      - item.labels | default([]) is sequence and item.labels | default([]) is not string
      - item.labels | default([]) | reject('match', '^[A-Za-z0-9_.-]+$') | list | length == 0
      - item.instances | default(1) | int >= 1
      - item.cpu_quota | default('') | string is match('^([0-9]+%)?$')
      - item.memory_max | default('') | string is match('^([0-9]+[KMGT]?)?$')
    fail_msg: >-
      Each entry of github_runners (ci_host_runners) needs repo (owner/name)
      and name (lowercase letters, digits, _), and may have labels (a list),
      instances (1 or more), cpu_quota (e.g. 50%) and memory_max (e.g. 2G).
    quiet: true
  loop: "{{ github_runners }}"
  loop_control:
    label: "{{ item.repo | default('?') }} {{ item.name | default('?') }}"

# a-b/c and a/b-c, or a repository listed twice, would share a name and one
# would silently replace the other (github_runner_names_unique).
- name: Check that every runner instance has its own name
  ansible.builtin.assert:
    that:
      - github_runner_names_unique | bool
    fail_msg: >-
      Two runners get the same name once the slash is dropped
      ({{ github_runner_wanted.keys() | list | join(', ') }}), or the same
      slice ({{ github_runner_child_slices | map(attribute='slice') | join(', ') }}):
      a repository, or a repository and runner name, is listed twice.
    quiet: true

- name: Check the runner token
  ansible.builtin.assert:
    that:
      - github_runner_token | length > 0
    fail_msg: >-
      Set GITHUB_RUNNER_TOKEN or github_runner_token_ref (README, GitHub
      Actions runner).
    quiet: true
  no_log: true

# Public repositories are refused here, and again by github-runner-job before
# every registration, in case one is made public later. A pull request from a
# fork of a public repository would run anyone's code on this host.
- name: Look up the repositories
  ansible.builtin.uri:
    url: "{{ github_api }}/repos/{{ item }}"
    headers: &github_headers
      Authorization: "Bearer {{ github_runner_token }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    status_code: [200, 401, 403, 404]
  loop: "{{ github_runner_lookup_repos }}"
  register: github_runner_repo_lookup
  check_mode: false
  no_log: true

- name: Refuse public repositories
  ansible.builtin.assert:
    that:
      - item.status == 200
      - item.json.private
      - item.json.visibility | default('private') == 'private'
    fail_msg: >-
      {{ item.item }} is not a private repository, or the token cannot read it
      (HTTP {{ item.status }}). The runner only serves private repositories.
    quiet: true
  loop: "{{ github_runner_repo_lookup.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Look up the organization's runner group
  ansible.builtin.uri:
    url: "{{ github_api }}/orgs/{{ github_runner_org }}/actions/runner-groups/{{ github_runner_group_id }}"
    headers: *github_headers
    status_code: [200, 401, 403, 404]
  register: github_runner_group_lookup
  check_mode: false
  when: github_runner_scope == 'org'
  no_log: true

- name: Refuse a runner group open to public repositories
  ansible.builtin.assert:
    that:
      - github_runner_group_lookup.status == 200
      - not github_runner_group_lookup.json.allows_public_repositories
    fail_msg: >-
      Runner group {{ github_runner_group_id }} of {{ github_runner_org }}
      allows public repositories, or the token cannot read it (HTTP
      {{ github_runner_group_lookup.status }}). Turn off "Allow public
      repositories" in the organization's Actions → Runner groups.
    quiet: true
  when: github_runner_scope == 'org'

# The runners' containers go into a systemd slice that holds the limits, which
# Docker supports only with its systemd cgroup driver.
# read-only: docker info.
- name: Read Docker's cgroup driver
  ansible.builtin.command:
    cmd: docker info --format {% raw %}'{{ .CgroupDriver }}'{% endraw %}
  register: github_runner_cgroup_driver
  check_mode: false
  changed_when: false
  # A check run on a new ci-1 has not installed Docker (roles/ci_host):
  # reported as ignored, and the driver is not checked.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check Docker's cgroup driver
  ansible.builtin.assert:
    that:
      - github_runner_cgroup_driver.stdout == 'systemd'
    fail_msg: >-
      Docker uses the {{ github_runner_cgroup_driver.stdout }} cgroup driver;
      the runner limits need systemd (exec-opts native.cgroupdriver=systemd in
      /etc/docker/daemon.json).
    quiet: true
  when: github_runner_cgroup_driver is succeeded

- name: Create the runner directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ github_runner_config_dir }}", mode: "0700" }
    - { path: "{{ github_runner_data_dir }}", mode: "0755" }

# Read by github-runner-job for every job, so it stays on the host, readable by
# root only.
- name: Write the runner token
  ansible.builtin.copy:
    content: "{{ github_runner_token }}\n"
    dest: "{{ github_runner_config_dir }}/token"
    mode: "0600"
  no_log: true

- name: Write the runner settings
  ansible.builtin.copy:
    content: "{{ github_runner_settings | to_nice_json }}\n"
    dest: "{{ github_runner_config_dir }}/config.json"
    mode: "0644"
  vars:
    github_runner_settings:
      api: "{{ github_api }}"
      instances: "{{ github_runner_instance_settings }}"
      labels: "{{ github_runner_labels }}"
      slice: "{{ github_runner_slice }}"
      runner_group_id: "{{ github_runner_group_id | int }}"
      name_prefix: "{{ github_runner_name_prefix }}"
      data_dir: "{{ github_runner_data_dir }}"
      uid: "{{ github_runner_uid | int }}"
      min_free_disk_gb: "{{ github_runner_min_free_disk_gb | int }}"
      tool_cache_max_gb: "{{ github_runner_tool_cache_max_gb | int }}"
      visibility_check_seconds: "{{ github_runner_visibility_check_seconds | int }}"

- name: Write the runner compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ github_runner_config_dir }}/compose.yml"
    mode: "0644"

- name: Install the runner scripts
  ansible.builtin.copy:
    src: github-runner-job
    dest: /usr/local/bin/github-runner-job
    mode: "0755"

- name: Install the runner image update script
  ansible.builtin.template:
    src: github-runner-update.j2
    dest: /usr/local/bin/github-runner-update
    mode: "0755"

- name: Install the runner units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - "{{ github_runner_slice }}"
    - github-runner@.service
    - github-runner-update.service
    - github-runner-update.timer
  notify: Reload systemd for the runners

# The slices of github_runners' groups, each inside github_runner_slice with
# its own limits: a light runner capped low cannot starve a heavy one.
- name: Install the slices of the runner list
  ansible.builtin.template:
    src: github_runner-child.slice.j2
    dest: "/etc/systemd/system/{{ item.slice }}"
    mode: "0644"
  loop: "{{ github_runner_child_slices }}"
  loop_control:
    label: "{{ item.slice }}"
  notify: Reload systemd for the runners

- name: Find the slices of runners no longer listed
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "{{ github_runner_slice | regex_replace('\\.slice$', '') }}-*.slice"
    file_type: file
  register: github_runner_slice_files

- name: Remove the slices of runners no longer listed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ github_runner_slice_files.files | map(attribute='path') | map('basename')
       | difference(github_runner_child_slices | map(attribute='slice'))
       | map('regex_replace', '^', '/etc/systemd/system/') | list }}
  notify: Reload systemd for the runners

- name: Pull the runner images
  ansible.builtin.command:
    cmd: "docker pull {{ item }}"
  loop: "{{ [github_runner_image] + ([github_runner_dind_image] if github_runner_docker else []) }}"
  register: github_runner_pull
  changed_when: "'Downloaded newer image' in github_runner_pull.stdout"

- name: Apply systemd changes before starting the runners
  ansible.builtin.meta: flush_handlers

- name: Enable the runner image update timer
  ansible.builtin.systemd_service:
    name: github-runner-update.timer
    enabled: true
    state: started
  # A check run on a new host has not written the unit yet: reported as
  # ignored. A real run fails as before.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Start the runners
  ansible.builtin.systemd_service:
    name: "github-runner@{{ item }}.service"
    enabled: true
    state: started
  loop: "{{ github_runner_wanted.keys() | list }}"
  # A check run on a new host has not written the unit yet: reported as
  # ignored. A real run fails as before.
  ignore_errors: "{{ ansible_check_mode }}"
