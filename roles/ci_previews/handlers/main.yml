---
- name: Reload sshd for Coolify
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload systemd for the previews
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart ci-1's cloudflared
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: "{{ ci_previews_cloudflared_dir }}"
  changed_when: true
