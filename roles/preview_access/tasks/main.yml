---
# Cloudflare Access protects preview_zones at Cloudflare's edge only. Traefik
# listens on 127.0.0.1:80 and routes by Host header, so without this any
# process on this host could skip the login with
# `curl -H 'Host: main.<zone>' http://127.0.0.1/`. Here Traefik checks the
# token itself: every request goes through preview-access (a forward-auth
# service on the coolify network), which refuses a host on a protected zone
# unless the request carries a valid Cf-Access-Jwt-Assertion for that zone's
# Access application. Hosts on `domain` pass as before. Hosts on a
# tailnet-only zone pass without a token, unless the request came through
# Cloudflare (preview_access_tailnet_zones).
#
# Needs cloudflare_access_team_domain and cloudflare_access_auds from the
# cloudflare_tunnel role, which creates the Access applications (on the
# remote host, the ci_previews role reads them).
#
# The remote host also sets preview_access_hosts, so it answers for PR
# previews only, and has no Coolify of its own: its proxy is changed from the
# preview host (preview_access_manage_proxy).

- name: Protect the preview zones on this host too
  when: preview_access_wanted | bool
  block:
    - name: Check the Access settings
      ansible.builtin.assert:
        that:
          - preview_access_zones | length == 0 or cloudflare_access_team_domain | default('') is match('^[a-z0-9.-]+$')
          - preview_access_zones == preview_protected_zones | sort
          - cloudflare_access_auds | default({}) | dict2items | map(attribute='value') | map('first') | map('length') | select('equalto', 0) | list | length == 0
          - preview_access_probe_zones | length > 0 or preview_access_zones | length == 0
        fail_msg: >-
          Every zone of preview_zones but the tailnet-only ones needs its
          Access application's audience (AUD) and the Access team domain: run
          the whole playbook, not this role alone.
        quiet: true
      # In check mode, an Access application the run would create has no
      # audience yet: reported, not fatal.
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Create the preview-access directory
      ansible.builtin.file:
        path: "{{ preview_access_dir }}"
        state: directory
        mode: "0755"

    - name: Install preview-access
      ansible.builtin.copy:
        src: preview-access.py
        dest: "{{ preview_access_dir }}/preview-access.py"
        mode: "0644"
      notify: Restart preview-access

    - name: Write the preview-access settings
      ansible.builtin.copy:
        content: >-
          {{ {'listen': ['0.0.0.0', preview_access_port | int],
              'issuer': 'https://' ~ (cloudflare_access_team_domain | default('', true)),
              'zones': cloudflare_access_auds | default({})}
             | combine({'hosts': preview_access_hosts} if preview_access_hosts else {})
             | combine({'tailnet_zones': preview_access_tailnet_zones} if preview_access_tailnet_zones else {})
             | to_nice_json }}
        dest: "{{ preview_access_dir }}/config.json"
        mode: "0644"
      notify: Restart preview-access

    - name: Write the preview-access compose file
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ preview_access_dir }}/compose.yml"
        mode: "0644"
      notify: Restart preview-access

    - name: Start preview-access
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ preview_access_dir }}"
      register: preview_access_up
      changed_when: "'Started' in preview_access_up.stderr or 'Recreated' in preview_access_up.stderr"

    - name: Apply the preview-access changes
      ansible.builtin.meta: flush_handlers

    # Traefik answers 500 to every request while the middleware's service is
    # down, so it must answer before Traefik uses it. A request with no Host
    # gets 200, or 403 where preview_access_hosts narrows the hosts: either
    # way it answers.
    - name: Wait for preview-access
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - preview-access
          - python3
          - -c
          - |
            import urllib.error, urllib.request
            try:
                print(urllib.request.urlopen('http://127.0.0.1:{{ preview_access_port }}/').status)
            except urllib.error.HTTPError as error:
                print(error.code)
      register: preview_access_ready
      changed_when: false
      until: preview_access_ready.rc == 0 and preview_access_ready.stdout in ['200', '403']
      retries: 10
      delay: 3
      # Check mode starts nothing to wait for.
      when: not ansible_check_mode

    # Traefik's file provider picks up changes to this file by itself.
    - name: Create Traefik's dynamic configuration directory
      ansible.builtin.file:
        path: "{{ preview_access_traefik_file | dirname }}"
        state: directory
        mode: "0755"

    - name: Define the preview-access middleware in Traefik
      ansible.builtin.template:
        src: traefik.yaml.j2
        dest: "{{ preview_access_traefik_file }}"
        mode: "0644"

    - name: Put preview-access in front of every Traefik route
      ansible.builtin.include_tasks: entrypoints.yml
      vars:
        preview_access_on: true
      when: preview_access_manage_proxy | bool

    # On the remote host, Coolify starts the proxy once the host is added in
    # its dashboard (README, Previews on ci-1); until then there is nothing
    # to check.
    # read-only: docker ps.
    - name: Check whether Coolify's proxy runs here
      ansible.builtin.command: docker ps --quiet --filter name=^coolify-proxy$ --filter status=running
      register: preview_access_proxy
      check_mode: false
      changed_when: false

    - name: Report a proxy that is not running yet
      ansible.builtin.debug:
        msg: >-
          Coolify's proxy is not running on {{ inventory_hostname }} yet, so
          the check that Traefik refuses requests without a token is skipped.
          Rerun the playbook once it runs.
      when: preview_access_proxy.stdout | length == 0

    # Straight to Traefik, as a local process would: refused, without the
    # Cloudflare Access login (or, on the remote host, for a host that is not
    # a PR preview).
    - name: Check that Traefik refuses the protected zones without a token
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ preview_access_probe }}.{{ item }}"
        status_code: 403
      loop: "{{ preview_access_probe_zones }}"
      loop_control:
        label: "curl -H 'Host: {{ preview_access_probe }}.{{ item }}' http://127.0.0.1/"
      register: preview_access_probe_result
      until: preview_access_probe_result is not failed
      retries: 12
      delay: 5
      when: preview_access_proxy.stdout | length > 0

    # As a request through a tunnel would come: refused on a tailnet-only zone.
    - name: Check that Traefik refuses the tailnet-only zones through Cloudflare
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ preview_access_probe }}.{{ item }}"
          Cf-Connecting-Ip: 192.0.2.1
        status_code: 403
      loop: "{{ preview_access_tailnet_zones }}"
      loop_control:
        label: "curl -H 'Host: {{ preview_access_probe }}.{{ item }}' -H 'Cf-Connecting-Ip: 192.0.2.1' http://127.0.0.1/"
      register: preview_access_tailnet_probe
      until: preview_access_tailnet_probe is not failed
      retries: 12
      delay: 5
      when: preview_access_proxy.stdout | length > 0

# Without preview_zones nothing is protected: take the middleware off
# Traefik first, then stop the service it calls.
- name: Remove preview-access
  when: not (preview_access_wanted | bool)
  block:
    - name: Take preview-access off Traefik's routes
      ansible.builtin.include_tasks: entrypoints.yml
      vars:
        preview_access_on: false
      when: preview_access_manage_proxy | bool

    - name: Remove the preview-access middleware from Traefik
      ansible.builtin.file:
        path: "{{ preview_access_traefik_file }}"
        state: absent

    - name: Look for preview-access
      ansible.builtin.stat:
        path: "{{ preview_access_dir }}/compose.yml"
      register: preview_access_compose

    - name: Stop preview-access
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ preview_access_dir }}"
      changed_when: true
      when: preview_access_compose.stat.exists

    - name: Remove the preview-access directory
      ansible.builtin.file:
        path: "{{ preview_access_dir }}"
        state: absent
