---
# Security updates every day, from Ubuntu's security pocket (the default of
# 50unattended-upgrades). An update that needs a reboot (a kernel, libc)
# reboots the host at ci_host_reboot_time, never as soon as it is installed.

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Turn on the daily updates and the reboot window
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 52preview-infra-upgrades
