---
- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart memory-floor
  ansible.builtin.systemd_service:
    name: memory-floor
    state: restarted

# A oneshot: restarting it loads the rules again (nft -f replaces the table).
- name: Restart preview isolation
  ansible.builtin.systemd_service:
    name: preview-isolation
    state: restarted
