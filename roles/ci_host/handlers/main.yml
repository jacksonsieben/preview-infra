---
- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart memory-floor
  ansible.builtin.systemd_service:
    name: memory-floor
    state: restarted
