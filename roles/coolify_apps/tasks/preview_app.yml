---
# One entry of preview_apps. The application itself is made by hand in Coolify
# (README, More zones and apps); only its environment variables, `previews`
# when given, and on ci-1 its preview limits and Auto Deploy, are set here.
# It is found by its repository, and by `name` when the repository has several.

- name: "Find the application for {{ coolify_app_item.repository }}"
  ansible.builtin.set_fact:
    coolify_preview_matches: >-
      {{ coolify_applications
         | selectattr('git_repository', 'defined')
         | selectattr('git_repository', 'match', '(?i)^' ~ (coolify_app_item.repository | regex_escape) ~ '$')
         | list }}

- name: "Narrow {{ coolify_app_item.repository }} down by name"
  ansible.builtin.set_fact:
    coolify_preview_matches: "{{ coolify_preview_matches | selectattr('name', 'equalto', coolify_app_item.name) | list }}"
  when: coolify_preview_matches | length > 1

# One that sets nothing may not be in Coolify yet: nothing to do then.
- name: "Check that {{ coolify_app_item.repository }} is in Coolify"
  ansible.builtin.assert:
    that: coolify_preview_matches | length == 1
    fail_msg: >-
      {{ coolify_app_item.name }} sets preview_env or production_env, but Coolify
      has no single application for {{ coolify_app_item.repository }}
      named '{{ coolify_app_item.name }}'. Create it first (README, More zones
      and apps), or give it the Coolify application's name.
    quiet: true
  when: >-
    coolify_app_item.preview_env | default({}, true) | length > 0
    or coolify_app_item.production_env | default({}, true) | length > 0

- name: "Set the environment variables of {{ coolify_app_item.repository }}"
  ansible.builtin.include_tasks: env.yml
  vars:
    coolify_env_app_uuid: "{{ coolify_preview_matches[0].uuid }}"
    coolify_env_label: "{{ coolify_app_item.name }}"
  when: coolify_preview_matches | length == 1

# An app on ci-1 (`server`, README, Previews on ci-1) is there for its PR
# previews: never deployed on a push to its branch, and each preview within
# the CPU and memory limits, without swap. Coolify applies its limits to
# every preview of the app.
- name: "Work out the wanted settings of {{ coolify_app_item.repository }}"
  ansible.builtin.set_fact:
    coolify_preview_on_ci: "{{ coolify_app_item.server | default('') == ci_previews_coolify_server }}"
    coolify_preview_limits:
      limits_cpus: "{{ coolify_app_item.cpus | default(ci_previews_cpus) | string }}"
      limits_memory: "{{ coolify_app_item.memory | default(ci_previews_memory) | string }}"
      limits_memory_swap: "{{ coolify_app_item.memory | default(ci_previews_memory) | string }}"

# These take effect on the next deployment (a push to a PR), so nothing is
# deployed here.
- name: "Read the settings of {{ coolify_app_item.repository }}"
  ansible.builtin.uri:
    url: "{{ coolify_api }}/applications/{{ coolify_preview_matches[0].uuid }}"
    headers: &coolify_headers
      Authorization: "Bearer {{ coolify_api_session.token }}"
      Accept: application/json
  register: coolify_preview_current
  when:
    - coolify_app_item.previews is defined or coolify_preview_on_ci | bool
    - coolify_preview_matches | length == 1

# Only the fields that differ go in the request; a setting Coolify didn't
# return counts as different.
- name: "Compare the settings of {{ coolify_app_item.repository }}"
  ansible.builtin.set_fact:
    coolify_preview_patch: >-
      {%- set cur = coolify_preview_current.json -%}
      {%- set settings = cur.settings | default({}, true) -%}
      {%- set ns = namespace(patch={}) -%}
      {%- if coolify_app_item.previews is defined
            and (settings.is_preview_deployments_enabled | default(none) is none
                 or (settings.is_preview_deployments_enabled | bool) != (coolify_app_item.previews | bool)) -%}
        {%- set ns.patch = ns.patch | combine({'is_preview_deployments_enabled': coolify_app_item.previews | bool}) -%}
      {%- endif -%}
      {%- if coolify_preview_on_ci | bool -%}
        {%- if settings.is_auto_deploy_enabled | default(none) is none or settings.is_auto_deploy_enabled | bool -%}
          {%- set ns.patch = ns.patch | combine({'is_auto_deploy_enabled': false}) -%}
        {%- endif -%}
        {%- for key, value in coolify_preview_limits.items() -%}
          {%- if (cur[key] | default('', true) | string) != value -%}
            {%- set ns.patch = ns.patch | combine({key: value}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.patch | to_json }}
  when: coolify_preview_current is not skipped

- name: "Update the settings of {{ coolify_app_item.repository }}"
  ansible.builtin.uri:
    url: "{{ coolify_api }}/applications/{{ coolify_preview_matches[0].uuid }}"
    method: PATCH
    headers: *coolify_headers
    body_format: json
    body: "{{ coolify_preview_patch | from_json }}"
  changed_when: true
  when:
    - coolify_preview_current is not skipped
    - coolify_preview_patch | from_json | length > 0
