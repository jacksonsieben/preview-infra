---
# The environment variables of one application, from coolify_app_item:
# preview_env goes in with is_preview: true and reaches only PR deployments,
# production_env with is_preview: false and reaches only the main one. Coolify
# keeps the two lists apart and a deployment reads just its own.
#
# A variable this role creates carries coolify_env_comment as its comment, and
# is deleted once it leaves both lists. Any other variable was made by hand: it
# is left alone, and a listed key it already holds stops the run.
#
# Every task that sees a value, or the token that reads them, is no_log. The
# values are stored literally (no ${VAR} expansion), at runtime only (never a
# build argument, which can end up in the image). A change takes effect on the
# next deployment.

# Previews first: creating a production variable also copies it to the
# previews, unless they have that key already. The copy is deleted below.
- name: "Work out the environment variables of {{ coolify_env_label }}"
  ansible.builtin.set_fact:
    coolify_env_wanted: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for list_name, preview in [('preview_env', true), ('production_env', false)] -%}
        {%- for key, value in (coolify_app_item[list_name] | default({}, true)).items() -%}
          {%- set value = '' if value is none else value | string | trim -%}
          {%- set ns.out = ns.out + [{
                'key': key | string, 'value': value, 'is_preview': preview,
                'is_literal': true, 'is_multiline': '\n' in value, 'is_shown_once': false,
                'is_runtime': true, 'is_buildtime': false, 'comment': coolify_env_comment}] -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.out | to_json }}
  no_log: true

- name: "Check the environment variable names of {{ coolify_env_label }}"
  ansible.builtin.assert:
    that: coolify_env_bad_keys | length == 0
    fail_msg: >-
      {{ coolify_env_label }}: {{ coolify_env_bad_keys | join(', ') }} in
      preview_env or production_env is not a valid name (letters, digits and _,
      not starting with a digit).
    quiet: true
  vars:
    coolify_env_bad_keys: >-
      {{ coolify_env_wanted | from_json | map(attribute='key') | reject('match', '^[A-Za-z_][A-Za-z0-9_]*$') | list }}

- name: "Read the environment variables of {{ coolify_env_label }}"
  ansible.builtin.uri:
    url: "{{ coolify_api }}/applications/{{ coolify_env_app_uuid }}/envs"
    headers: &coolify_env_headers
      Authorization: "Bearer {{ coolify_api_session.env_token | default(coolify_api_session.token, true) }}"
      Accept: application/json
  register: coolify_env_current
  no_log: true

- name: "Compare the environment variables of {{ coolify_env_label }}"
  ansible.builtin.set_fact:
    coolify_env_plan: >-
      {%- set ns = namespace(create=[], update=[], taken=[], differs=false) -%}
      {%- for want in coolify_env_wanted | from_json -%}
        {%- set have = coolify_env_current.json | selectattr('key', 'equalto', want.key)
                       | selectattr('is_preview', 'equalto', want.is_preview) | first | default(none) -%}
        {%- if have is none -%}
          {%- set ns.create = ns.create + [want] -%}
        {%- elif have.comment | default('', true) != coolify_env_comment -%}
          {%- set ns.taken = ns.taken + [want.key ~ (' (preview)' if want.is_preview else ' (production)')] -%}
        {%- else -%}
          {%- set ns.differs = have.value | default('', true) != want.value -%}
          {%- for flag in ['is_literal', 'is_multiline', 'is_shown_once', 'is_runtime', 'is_buildtime'] -%}
            {%- if (have[flag] | default(false) | bool) != want[flag] -%}
              {%- set ns.differs = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if ns.differs -%}
            {%- set ns.update = ns.update + [want] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'create': ns.create, 'update': ns.update, 'taken': ns.taken} | to_json }}
  no_log: true

- name: "Check that no listed variable of {{ coolify_env_label }} was set by hand"
  ansible.builtin.assert:
    that: (coolify_env_plan | from_json).taken | length == 0
    fail_msg: >-
      {{ coolify_env_label }} already has {{ (coolify_env_plan | from_json).taken | join(', ') }},
      made by hand in Coolify. Delete it there to let the playbook manage it, or
      take it out of preview_env/production_env.
    quiet: true

- name: "Create environment variables of {{ coolify_env_label }}"
  ansible.builtin.uri:
    url: "{{ coolify_api }}/applications/{{ coolify_env_app_uuid }}/envs"
    method: POST
    headers: *coolify_env_headers
    body_format: json
    body: "{{ item }}"
    status_code: 201
  changed_when: true
  loop: "{{ (coolify_env_plan | from_json).create }}"
  no_log: true

- name: "Update environment variables of {{ coolify_env_label }}"
  ansible.builtin.uri:
    url: "{{ coolify_api }}/applications/{{ coolify_env_app_uuid }}/envs"
    method: PATCH
    headers: *coolify_env_headers
    body_format: json
    body: "{{ item }}"
    status_code: [200, 201]
  changed_when: true
  loop: "{{ (coolify_env_plan | from_json)['update'] }}"
  no_log: true

- name: "Read the environment variables of {{ coolify_env_label }} again"
  ansible.builtin.uri:
    url: "{{ coolify_api }}/applications/{{ coolify_env_app_uuid }}/envs"
    headers: *coolify_env_headers
  register: coolify_env_created
  when: (coolify_env_plan | from_json).create | rejectattr('is_preview') | list | length > 0
  no_log: true

# Only the role's own variables, and only their key and id.
- name: "Find the environment variables {{ coolify_env_label }} no longer lists"
  ansible.builtin.set_fact:
    coolify_env_stale: >-
      {%- set ns = namespace(out=[]) -%}
      {%- set listed = (coolify_env_current if coolify_env_created is skipped else coolify_env_created).json -%}
      {%- for have in listed | selectattr('comment', 'equalto', coolify_env_comment) -%}
        {%- if coolify_env_wanted | from_json | selectattr('key', 'equalto', have.key)
               | selectattr('is_preview', 'equalto', have.is_preview) | list | length == 0 -%}
          {%- set ns.out = ns.out + [{'uuid': have.uuid, 'key': have.key, 'is_preview': have.is_preview}] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out | to_json }}
  no_log: true

- name: "Delete environment variables of {{ coolify_env_label }}"
  ansible.builtin.uri:
    url: "{{ coolify_api }}/applications/{{ coolify_env_app_uuid }}/envs/{{ item.uuid }}"
    method: DELETE
    headers: *coolify_env_headers
    status_code: 200
  changed_when: true
  loop: "{{ coolify_env_stale | from_json }}"
  no_log: true

# The other tasks hide their items; these are the names, without values.
- name: "Environment variables changed in {{ coolify_env_label }}"
  ansible.builtin.debug:
    msg: "{{ coolify_env_changes | from_json }}"
  vars:
    coolify_env_changes: >-
      {%- set plan = coolify_env_plan | from_json -%}
      {%- set ns = namespace(out=[]) -%}
      {%- for verb, envs in [('Created', plan.create), ('Updated', plan['update']), ('Deleted', coolify_env_stale | from_json)] -%}
        {%- for env in envs -%}
          {%- set ns.out = ns.out + [verb ~ ' ' ~ env.key ~ (' (preview)' if env.is_preview else ' (production)')] -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.out | to_json }}
  when: coolify_env_changes | from_json | length > 0
