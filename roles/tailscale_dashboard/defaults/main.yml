---
# Tailscale Serve hands port 443 of the tailnet address, as raw TCP, to
# Coolify's Traefik on 127.0.0.1:443. Traefik serves the dashboard on
# coolify_dashboard_hostname with its own certificate (DNS-01), so Serve
# terminates no TLS and has no per-path routes.
tailscale_dashboard_tcp_port: 443
tailscale_dashboard_target: 127.0.0.1:443
