---
# Serves the Coolify dashboard on the tailnet only, at
# https://<coolify_dashboard_hostname>: a grey DNS record to this host's
# tailnet address, port 443 forwarded by Tailscale Serve to Traefik. The host
# must already be logged in to Tailscale; this role does not install or
# authenticate it.

- name: Read the Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false

- name: Remember the tailnet name of this host
  ansible.builtin.set_fact:
    tailscale_status: "{{ tailscale_status_raw.stdout | from_json }}"

- name: Check that Tailscale runs and the dashboard has a name
  ansible.builtin.assert:
    that:
      - tailscale_status.BackendState == 'Running'
      - coolify_dashboard_hostname is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
    fail_msg: >-
      Tailscale must be logged in, and coolify_dashboard_hostname set to the
      dashboard's name (coolify.example.dev, in a tailnet-only zone, README,
      Step 3).
    quiet: true

- name: Read the current Tailscale Serve settings
  ansible.builtin.command: tailscale serve status --json
  register: tailscale_serve_raw
  changed_when: false

# An HTTPS handler on the same port (the old .ts.net dashboard) holds it.
- name: Drop the old HTTPS routes of the dashboard
  ansible.builtin.command:
    argv: [tailscale, serve, "--https={{ tailscale_dashboard_tcp_port }}", "off"]
  when: >-
    (tailscale_serve_raw.stdout | from_json).Web | default({}, true)
    | dict2items | selectattr('key', 'match', '.*:' ~ tailscale_dashboard_tcp_port ~ '$') | list | length > 0
  changed_when: true

- name: Forward the tailnet's port 443 to Traefik
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - --bg
      - "--tcp={{ tailscale_dashboard_tcp_port }}"
      - "tcp://{{ tailscale_dashboard_target }}"
  when: >-
    (((tailscale_serve_raw.stdout | from_json).TCP | default({}, true))[tailscale_dashboard_tcp_port | string]
     | default({})).TCPForward | default('') != tailscale_dashboard_target
  changed_when: true

# Coolify builds the links in its PR comments and notifications from the
# instance domain, and Traefik routes that name to the dashboard. The GitHub
# App keeps the webhook URL it was created with (coolify.<domain>/webhooks/...,
# still public through the tunnel).
- name: Make the dashboard's name Coolify's instance domain
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - coolify
      - php
      - /var/www/html/artisan
      - tinker
      - --execute
      - >-
        $s = App\Models\InstanceSettings::get();
        $s->fqdn = 'https://{{ coolify_dashboard_hostname }}';
        if ($s->isDirty()) {
          $s->save();
          App\Models\Server::find(0)->setupDynamicProxyConfiguration();
          echo 'changed';
        } else { echo 'ok'; }
  register: coolify_instance_domain
  changed_when: "'changed' in coolify_instance_domain.stdout"
