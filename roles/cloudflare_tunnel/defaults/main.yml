---
cloudflare_api: https://api.cloudflare.com/client/v4
cloudflare_tunnel_name: preview-host

# Pin a tag (e.g. cloudflare/cloudflared:2026.9.1) for reproducible rebuilds.
cloudflared_image: cloudflare/cloudflared:latest
cloudflared_dir: /opt/cloudflared

# Rules are matched top to bottom. Everything on the wildcard goes to Coolify's
# Traefik, which routes by Host header to the right preview. Targets use
# 127.0.0.1, not localhost: cloudflared tries ::1 first, and Coolify publishes
# on IPv4 loopback only (its realtime server listens on IPv4 only anyway).
#
# With coolify_dashboard: tailscale, coolify.<domain> answers only GitHub's
# webhooks; the dashboard is served on the tailnet. With `public`, the whole
# dashboard goes through the tunnel (realtime on 6001, terminal on 6002).
cloudflare_tunnel_coolify_ingress:
  tailscale:
    - hostname: "{{ coolify_hostname }}"
      path: ^/webhooks/
      service: http://127.0.0.1:8000
    - hostname: "{{ coolify_hostname }}"
      service: http_status:404
  public:
    - hostname: "{{ coolify_hostname }}"
      path: ^/app/
      service: http://127.0.0.1:6001
    - hostname: "{{ coolify_hostname }}"
      path: ^/terminal/ws
      service: http://127.0.0.1:6002
    - hostname: "{{ coolify_hostname }}"
      service: http://127.0.0.1:8000

cloudflare_tunnel_ingress: >-
  {{ cloudflare_tunnel_coolify_ingress[coolify_dashboard]
     + production_hostnames | map('community.general.dict_kv', 'hostname')
       | map('combine', {'service': 'http://127.0.0.1:80'}) | list
     + [
       {'hostname': preview_wildcard, 'service': 'http://127.0.0.1:80'},
     ] + cloudflare_extra_zones | map(attribute='wildcard') | map('community.general.dict_kv', 'hostname')
         | map('combine', {'service': 'http://127.0.0.1:80'}) | list + [
       {'service': 'http_status:404'},
     ] }}

# DNS records pointed at the tunnel, in `domain`. More specific records (apex,
# www) still win over the wildcard, so production can live elsewhere, unless it
# is listed in production_hostnames. Each zone in preview_zones gets its
# wildcard pointed there too.
cloudflare_tunnel_dns_names: "{{ [coolify_hostname, preview_wildcard] + production_hostnames }}"

# preview_zones with their defaults filled in.
cloudflare_extra_zones: >-
  {%- set zones = [] -%}
  {%- for z in preview_zones -%}
  {%- set _ = zones.append({'zone': '', 'wildcard': '*.' ~ (z.zone | default('')), 'access_emails': preview_access_emails} | combine(z)) -%}
  {%- endfor -%}
  {{ zones }}

# Name opened on each zone in preview_zones after the run, which must answer
# with the Cloudflare Access login rather than reach Coolify.
cloudflare_access_probe: preview-infra-check
