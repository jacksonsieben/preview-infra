---
cloudflare_api: https://api.cloudflare.com/client/v4
cloudflare_tunnel_name: preview-host

# Pin a tag (e.g. cloudflare/cloudflared:2026.9.1) for reproducible rebuilds.
cloudflared_image: cloudflare/cloudflared:latest
cloudflared_dir: /opt/cloudflared

# Rules are matched top to bottom. Everything on the wildcard goes to Coolify's
# Traefik, which routes by Host header to the right preview. Targets use
# 127.0.0.1, not localhost: cloudflared tries ::1 first, and Coolify publishes
# on IPv4 loopback only (its realtime server listens on IPv4 only anyway).
#
# With coolify_dashboard: tailscale, coolify.<domain> answers only GitHub's
# webhooks; the dashboard is served on the tailnet. With `public`, the whole
# dashboard goes through the tunnel (realtime on 6001, terminal on 6002).
cloudflare_tunnel_coolify_ingress:
  tailscale:
    - hostname: "{{ coolify_hostname }}"
      path: ^/webhooks/
      service: http://127.0.0.1:8000
    - hostname: "{{ coolify_hostname }}"
      service: http_status:404
  public:
    - hostname: "{{ coolify_hostname }}"
      path: ^/app/
      service: http://127.0.0.1:6001
    - hostname: "{{ coolify_hostname }}"
      path: ^/terminal/ws
      service: http://127.0.0.1:6002
    - hostname: "{{ coolify_hostname }}"
      service: http://127.0.0.1:8000

#
# A zone whose previews ci-1 serves (cloudflare_ci_zones) keeps only the names
# listed in production_hostnames here: its wildcard goes to ci-1's tunnel.
# Names on tailnet-only zones get no route at all (cloudflare_tailnet_names).
cloudflare_tunnel_ingress: >-
  {{ cloudflare_tunnel_coolify_ingress[coolify_dashboard]
     + cloudflare_tunnel_production_names | map('community.general.dict_kv', 'hostname')
       | map('combine', {'service': 'http://127.0.0.1:80'}) | list
     + ([] if domain | lower in cloudflare_ci_zones else [
       {'hostname': preview_wildcard, 'service': 'http://127.0.0.1:80'},
     ]) + cloudflare_local_zones | map(attribute='wildcard') | map('community.general.dict_kv', 'hostname')
         | map('combine', {'service': 'http://127.0.0.1:80'}) | list + [
       {'service': 'http_status:404'},
     ] }}

# DNS records pointed at the tunnel. More specific records (apex, www) still
# win over the wildcard, so production can live elsewhere, unless it is listed
# in production_hostnames. Each zone in preview_zones gets its wildcard
# pointed there too (cloudflare_local_zones), unless ci-1 serves its previews.
cloudflare_tunnel_dns_names: >-
  {{ [coolify_hostname]
     + ([] if domain | lower in cloudflare_ci_zones else [preview_wildcard])
     + cloudflare_tunnel_production_names }}

# The Coolify dashboard's name, with coolify_dashboard tailscale.
cloudflare_dashboard_names: >-
  {{ [coolify_dashboard_hostname] if coolify_dashboard == 'tailscale' and coolify_dashboard_hostname else [] }}

# The zone of each name this host serves: the longest of `domain` and
# preview_zones that the name is, or ends with. Empty for a name on none of
# them (the run stops then).
cloudflare_tunnel_dns_zones: >-
  {%- set zones = ([domain] + preview_zones | map(attribute='zone', default='') | list) | map('lower') | list -%}
  {%- set out = {} -%}
  {%- for name in [coolify_hostname, preview_wildcard] + production_hostnames + cloudflare_dashboard_names -%}
  {%- set ns = namespace(zone='') -%}
  {%- for zone in zones if zone and (name | lower == zone or (name | lower).endswith('.' ~ zone)) -%}
  {%- if zone | length > ns.zone | length %}{% set ns.zone = zone %}{% endif -%}
  {%- endfor -%}
  {%- set _ = out.update({name: ns.zone}) -%}
  {%- endfor -%}
  {{ out }}

# production_hostnames that go through the tunnel: those not on a tailnet-only zone.
cloudflare_tunnel_production_names: >-
  {{ production_hostnames | reject('in', cloudflare_tailnet_hostnames) | list }}

# The names on tailnet-only zones that this host serves: the dashboard and
# those of production_hostnames. Each gets an unproxied A record to this
# host's tailnet address, and no tunnel route.
cloudflare_tailnet_hostnames: >-
  {%- set out = [] -%}
  {%- for name in production_hostnames + cloudflare_dashboard_names
      if cloudflare_tunnel_dns_zones[name] | default('') in preview_tailnet_zones -%}
  {%- set _ = out.append(name) -%}
  {%- endfor -%}
  {{ out | unique }}

# Those names, and the wildcards of the tailnet-only zones whose previews stay
# here (cloudflare_local_tailnet_zones), each with its zone.
cloudflare_tailnet_names: >-
  {%- set out = [] -%}
  {%- for name in cloudflare_tailnet_hostnames -%}
  {%- set _ = out.append({'name': name, 'zone': cloudflare_tunnel_dns_zones[name]}) -%}
  {%- endfor -%}
  {%- for z in cloudflare_local_tailnet_zones -%}
  {%- set _ = out.append({'name': z.wildcard | lower, 'zone': z.zone | lower}) -%}
  {%- endfor -%}
  {{ out }}

# The zones whose PR previews ci-1 serves through its own tunnel
# (roles/ci_previews): their wildcard is neither routed here nor pointed at
# this tunnel. Their Access application stays here, for both hosts.
cloudflare_ci_zones: "{{ ci_previews_zones | map('lower') | list if ci_previews_enabled | bool else [] }}"

# preview_zones with their defaults filled in.
cloudflare_extra_zones: >-
  {%- set zones = [] -%}
  {%- for z in preview_zones -%}
  {%- set _ = zones.append({'zone': '', 'wildcard': '*.' ~ (z.zone | default('')), 'access_emails': preview_access_emails} | combine(z)
                           | combine({'tailnet': z.tailnet | default(false) | bool})) -%}
  {%- endfor -%}
  {{ zones }}

# The zones of preview_zones behind Cloudflare Access: all but the
# tailnet-only ones. Each gets an Access application, and the login check.
cloudflare_access_zones: "{{ cloudflare_extra_zones | rejectattr('tailnet') | list }}"

# The zones behind Access whose wildcard comes to this host's tunnel.
cloudflare_local_zones: >-
  {%- set zones = [] -%}
  {%- for z in cloudflare_access_zones if z.zone | lower not in cloudflare_ci_zones -%}
  {%- set _ = zones.append(z) -%}
  {%- endfor -%}
  {{ zones }}

# The tailnet-only zones whose previews stay on this host (not on ci-1).
cloudflare_local_tailnet_zones: >-
  {%- set zones = [] -%}
  {%- for z in cloudflare_extra_zones if z.tailnet and z.zone | lower not in cloudflare_ci_zones -%}
  {%- set _ = zones.append(z) -%}
  {%- endfor -%}
  {{ zones }}

# Name opened on each zone behind Access after the run, which must answer
# with the Cloudflare Access login rather than reach Coolify.
cloudflare_access_probe: preview-infra-check
