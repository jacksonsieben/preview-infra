---
# Your own settings. Copy this file to group_vars/all/local.yml and edit it:
#
#   cp local.example.yml group_vars/all/local.yml
#
# local.yml is in .gitignore. Every setting you can change is listed, with its
# default, in group_vars/all/defaults.yml.

# A zone on your Cloudflare account. Previews land on pr-<n>-preview.<domain>.
domain: example.com

# tailscale (dashboard on your tailnet only) or public (through the tunnel).
coolify_dashboard: tailscale
# With tailscale: the dashboard's name, on a tailnet-only zone (README, Step 3
# and Tailnet-only zones). Traefik needs a Cloudflare token for DNS-01 in
# coolify_dns_token_file (/etc/preview-infra/cloudflare-dns-token), which you
# put there yourself.
# coolify_dashboard_hostname: coolify.example.dev

# 1Password references, if you keep the secrets there. Leave them out and set
# CLOUDFLARE_API_TOKEN, COOLIFY_ROOT_USERNAME, COOLIFY_ROOT_EMAIL and
# COOLIFY_ROOT_PASSWORD in the environment instead.
cloudflare_api_token_ref: op://Ansible/Cloudflare API Token - tunnel/credential
coolify_root_ref: op://Private/Coolify

# Applications to deploy, through the GitHub App you registered in Coolify
# (README, Step 4). Every option is in group_vars/all/defaults.yml.
coolify_github_app: coolify-example
coolify_apps:
  - repo: you/site
    project: Site
    domains: ["{{ domain }}", "www.{{ domain }}"]
    port: 8080
    # Only in PR previews, never in production (README, Environment variables).
    # The lookup reads 1Password with the service account in
    # OP_SERVICE_ACCOUNT_TOKEN; the value never goes in this file.
    # preview_env:
    #   SITE_PREVIEW: "1"
    #   SITE_PREVIEW_CODE: "{{ lookup('community.general.onepassword', 'Site preview code', field='credential', vault='Ansible') }}"
    # production_env: {}   # only in production, same format

# Builds at once on this host (default 1). To build one app's previews only on
# demand, add `previews: false` to its entry (README, Build load).
# coolify_concurrent_builds: 1

# The apex is not covered by the wildcard: list it to route it here too. Its
# DNS record is replaced with one pointing at the tunnel.
# production_hostnames: ["{{ domain }}"]

# A second zone for another project's previews (README, More zones and apps).
# Everything on it asks for a Cloudflare Access login first; only these
# e-mails get in.
# preview_access_emails: [you@example.com]
# preview_zones:
#   - zone: example.dev
#
# Or a zone served on your tailnet only, with no tunnel and no Access login:
# its names point at a tailnet address and Traefik gets its certificates
# through DNS-01 (README, Tailnet-only zones).
# preview_zones:
#   - zone: example.dev
#     tailnet: true

# Apps created by hand in Coolify, for previews on other zones; the playbook
# prints what to enter. A repository is in coolify_apps or here, not both.
# preview_apps:
#   - name: myapp
#     repository: you/myapp
#     zone: example.dev
#     port: 8080
#     healthcheck_path: /health
#     data_path: /data
#     preview_env:
#       MYAPP_PREVIEW: "1"
#       MYAPP_PREVIEW_CODE: "{{ lookup('community.general.onepassword', 'MyApp preview code', field='credential', vault='Ansible') }}"

# GitHub Actions runner for your private repositories (README, GitHub Actions
# runner). The token goes in GITHUB_RUNNER_TOKEN or in 1Password.
# github_runner_enabled: true
# github_runner_scope: repo
# github_runner_repos:
#   - your-user/private-repo
# github_runner_instances: 1
# github_runner_token_ref: op://Ansible/GitHub runner token/credential

# Running on another machine over SSH: put it in inventory/hosts.yml.

# The remote host (README, Remote host (ci-1)): its Tailscale address or
# MagicDNS name, and the ntfy topic that hears when it is about to look idle
# to Oracle. Use a long random topic: whoever knows it can read it.
# ci_host_address: 100.101.102.103
# ci_host_ntfy_topic: ""

# GitHub Actions runners on ci-1 (README, Runner on ci-1), ARM64, with the
# same token as above. Workflows use `runs-on: [self-hosted, ARM64, ci-1]`.
# ci_host_runner_enabled: true
# ci_host_runner_repos:
#   - your-user/private-repo
#
# Or several runners per repository, by capability label (README, Several
# runners per repository), instead of ci_host_runner_repos. Both keep the
# ci-1 label until the workflows use ci-heavy / ci-light.
# ci_host_runners:
#   - repo: your-user/private-repo
#     name: heavy
#     labels: [ci-heavy]
#   - repo: your-user/private-repo
#     name: light
#     labels: [ci-light]
#     cpu_quota: 50%
#     memory_max: 2G

# PR previews on ci-1 instead of here (README, Previews on ci-1). Coolify
# here builds and runs them there; ci-1 publishes them through its own
# tunnel. Production stays here: list what this host still serves on those
# zones in production_hostnames.
# ci_previews_enabled: true
# ci_previews_zones: ["{{ domain }}", example.dev]
# production_hostnames: [main.example.dev]
# ci_previews_coolify_address: 100.101.102.104   # `tailscale ip -4` on this host
# ci_previews_coolify_key: ssh-ed25519 AAAA...   # ci-1's key in Coolify, public half
# ci_previews_networks: [myapp, site]            # one per app: previews-<name> on ci-1
# ci_previews_max: 3                             # previews running at once
# ci_previews_cpus: "1"                          # each preview's limits
# ci_previews_memory: 1g
# On a tailnet-only zone, ci-1's Traefik needs its own Cloudflare token for
# DNS-01, which you put on ci-1 yourself (README, Tailnet-only zones):
# ci_previews_dns_token_file: /etc/preview-infra/cloudflare-dns-token
# preview_apps:
#   - name: myapp                  # production, here: no previews
#     repository: you/myapp
#     zone: example.dev
#     port: 8740
#     healthcheck_path: /health
#     data_path: /data
#     previews: false
#   - name: myapp-previews         # the same repository, on ci-1, for its PRs
#     repository: you/myapp
#     zone: example.dev
#     port: 8740
#     healthcheck_path: /health
#     data_path: /data
#     server: ci-1                 # ci_previews_coolify_server
#     network: myapp               # one of ci_previews_networks
#     previews: true
#     memory: 768m                 # optional, else ci_previews_memory
