---
# Defaults for every setting. Do not edit this file for your own setup: put
# your values in group_vars/all/local.yml (copy local.example.yml). Ansible
# reads the files in this directory in alphabetical order, so local.yml is read
# after defaults.yml and wins. --extra-vars wins over both.

# ---------------------------------------------------------------------------
# Domain
#
# The zone must already be on Cloudflare. Every preview gets a first-level
# subdomain (pr-36-preview.example.com): Cloudflare's free certificate covers
# *.example.com but not *.something.example.com.
# ---------------------------------------------------------------------------
domain: example.com
coolify_hostname: "coolify.{{ domain }}"
preview_wildcard: "*.{{ domain }}"

# Hostnames that are not covered by the wildcard but should reach Coolify, for an
# application deployed here as production. The wildcard already covers every
# first-level name (www included); the apex is the usual one to add:
#
#   production_hostnames: ["{{ domain }}"]
#
# Each gets a tunnel route to Traefik and a proxied CNAME, which replaces any
# record the name had. Then give the application that domain in Coolify.
# A name may be on `domain` or on a zone of preview_zones (still behind its
# Access login). On a zone whose previews moved to ci-1 (ci_previews_zones),
# list here everything this host still serves there: main.<zone>, for one.
# On a tailnet-only zone (preview_zones, `tailnet: true`) a name gets no
# tunnel route: an unproxied A record to this host's tailnet address instead.
production_hostnames: []

# ---------------------------------------------------------------------------
# Applications, through Coolify's API
#
# Every application, declared here, created or corrected through Coolify's API
# on every run: only the fields that differ are changed. The GitHub App they
# deploy from is the one manual step (README, Step 4): name it in
# coolify_github_app. Each entry needs `repo` and `project`; the rest has
# defaults in roles/coolify_apps/defaults/main.yml. Before a first run over
# apps already in Coolify, `ansible-playbook apps_plan.yml` prints what it would
# change (README, Plan the applications).
#
#   coolify_apps:
#     - repo: you/site
#       project: Site
#       domains: ["{{ domain }}", "www.{{ domain }}"]   # served as http:// (see README)
#       port: 8080
#       preview_name: preview   # previews at pr-<n>-preview.<zone>
#       previews: true          # false: on demand only (README, Build load)
#       preview_env: {}         # optional, see "Environment variables" below
#       production_env: {}
#
# On another zone (README, More zones and apps), with a health check and storage:
#
#     - repo: you/myapp
#       name: myapp                # optional: picks one of several apps of the repo
#       project: MyApp
#       zone: example.dev          # `domain` (the default) or one of preview_zones
#       preview_name: ""           # previews at pr-<n>.<zone>; "" when it's the only app there
#       port: 8740
#       healthcheck_path: /health  # optional: GET, answers 200 when ready
#       data_path: /data           # optional: a volume, its own per preview
#
# With `zone` and no `domains`, production is at main-<preview_name>.<zone>
# (main.<zone> with preview_name ""). Every domain must be routed here: by
# production_hostnames, by the wildcard of `domain` or of a zone, one level
# deep. With several apps on one zone, give each a preview_name: PR numbers
# repeat across repositories. A volume is only ever added, never deleted.
#
# An entry with `image` runs a published image instead of building the branch
# (README, Deploy on release): no build here, no auto deploy, no previews.
# It needs a `name`, by which it is found in Coolify. The release workflow
# deploys it through Coolify's deploy endpoint; `image_tag` picks the tag
# (latest follows the releases; a version pins it, for a rollback).
#
#     - repo: you/app
#       name: app
#       project: App
#       image: ghcr.io/you/app
#       image_tag: latest
#       domains: ["app.{{ domain }}"]
#       port: 8080
# ---------------------------------------------------------------------------
coolify_github_app: ""
coolify_apps: []

# A private image's registry: this host logs in to it as root, and Coolify
# pulls with that login. The token only reads packages (GitHub: a classic
# token with read:packages); put it in local.yml or 1Password, never in git.
# Empty: no login (a public image).
coolify_registry: ghcr.io
coolify_registry_username: ""
coolify_registry_token: ""

# On when an entry of coolify_apps has `image`: Coolify's API stays enabled
# after the run, and the tunnel serves coolify.<domain>/api/v1/deploy (and
# nothing else of the API) for the release workflow (README, Deploy on release).
coolify_deploy_endpoint: "{{ coolify_apps | selectattr('image', 'defined') | list | length > 0 }}"

# How many builds Coolify runs at once on this host, previews and production
# together. The others wait in its queue. A build can use every CPU, so more
# than one at a time slows the whole machine.
coolify_concurrent_builds: 1

# Where the Coolify dashboard is reachable:
#   tailscale  only from your tailnet, at https://<coolify_dashboard_hostname>.
#              The tunnel serves just coolify.<domain>/webhooks/ for GitHub.
#   public     at coolify.<domain> through the tunnel, behind the login only.
coolify_dashboard: tailscale

# With coolify_dashboard tailscale: the dashboard's name, on a tailnet-only
# zone of preview_zones (README, Step 3), e.g. coolify.example.dev. It gets an
# unproxied A record to this host's tailnet address; Tailscale Serve hands
# port 443 there to Traefik, which serves the dashboard with a Let's Encrypt
# certificate it gets through Cloudflare DNS-01.
coolify_dashboard_hostname: ""

# The Cloudflare API token Traefik on this host uses for DNS-01, in a file you
# put there yourself (README, Tailnet-only zones): root-owned, mode 0600, the
# token alone. The playbook checks that it exists and never reads it. Traefik
# gets it mounted read-only. Needed with coolify_dashboard tailscale.
coolify_dns_token_file: /etc/preview-infra/cloudflare-dns-token

# ---------------------------------------------------------------------------
# More zones
#
# Other zones whose previews also go through this host, each on the same
# Cloudflare account as `domain`. Each gets its wildcard routed to Coolify and
# a Cloudflare Access application in front of it: only the e-mails listed can
# open anything on the wildcard. Leave empty for a single domain.
#
#   preview_zones:
#     - zone: example.dev
#       wildcard: "*.example.dev"        # optional, this is the default
#       access_emails: [you@example.com] # optional, default preview_access_emails
#       tailnet: false                   # optional, see below
#
# The wildcard stays one level deep (pr-12.example.dev), for the same
# certificate reason as above. Coolify's own hostname stays on `domain`.
#
# A zone with `tailnet: true` is served on the tailnet only (README,
# Tailnet-only zones): no tunnel route and no Access login, but unproxied A
# records to the tailnet address of the host that serves each name, and
# certificates through Cloudflare DNS-01. Whoever is on the tailnet (and the
# ACL lets in) opens it; nobody else does. access_emails is not needed then.
# ---------------------------------------------------------------------------
preview_zones: []

# The zones of preview_zones served on the tailnet only, and those behind
# Cloudflare Access. Not settings: they follow from preview_zones.
preview_tailnet_zones: >-
  {%- set out = [] -%}
  {%- for z in preview_zones if z.tailnet | default(false) | bool -%}
  {%- set _ = out.append(z.zone | default('') | lower) -%}
  {%- endfor -%}
  {{ out }}
preview_protected_zones: >-
  {{ preview_zones | map(attribute='zone', default='') | map('lower') | difference(preview_tailnet_zones) }}

# Who may open the previews on preview_zones (Cloudflare Access, one-time PIN
# by e-mail). Required for every zone in preview_zones but the tailnet-only
# ones: there is no open preview.
preview_access_emails: []

# How long a Cloudflare Access login lasts before it asks again.
preview_access_session_duration: 24h

# ---------------------------------------------------------------------------
# Environment variables
#
# Any entry of coolify_apps can set environment variables
# through Coolify's API: preview_env only in PR deployments, production_env
# only in the main one. Values are strings, usually a 1Password lookup; the
# playbook never prints them.
#
#   preview_env:
#     MYAPP_PREVIEW: "1"
#     MYAPP_PREVIEW_CODE: "{{ lookup('community.general.onepassword', 'MyApp preview',
#                              field='credential', vault='Ansible') }}"
#   production_env: {}
#
# Variables the playbook creates carry the comment in coolify_env_comment and
# are deleted once taken out of both lists; the ones made by hand in Coolify
# are never touched. Values are literal and runtime-only, and reach the app on
# its next deployment.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Secrets
#
# Each one is read from an environment variable when it is set, otherwise from
# 1Password through the `op` CLI when a reference is configured (op://...).
#
#   CLOUDFLARE_API_TOKEN    or cloudflare_api_token_ref (field: credential)
#   COOLIFY_ROOT_USERNAME   \
#   COOLIFY_ROOT_EMAIL       > or coolify_root_ref, a Login item with
#   COOLIFY_ROOT_PASSWORD   /   `username` = email, `password`, and `Name`
#   GITHUB_RUNNER_TOKEN     or github_runner_token_ref (only with
#                           github_runner_enabled; see the README)
#
# The Coolify login is only needed on the first run, when Coolify is installed.
# ---------------------------------------------------------------------------
cloudflare_api_token_ref: ""
coolify_root_ref: ""
github_runner_token_ref: ""

cloudflare_api_token: >-
  {{ lookup('env', 'CLOUDFLARE_API_TOKEN')
     or (lookup('ansible.builtin.pipe', 'op read ' ~ (cloudflare_api_token_ref | quote))
         if cloudflare_api_token_ref else '') }}
coolify_root_username: >-
  {{ lookup('env', 'COOLIFY_ROOT_USERNAME')
     or (lookup('ansible.builtin.pipe', 'op read ' ~ ((coolify_root_ref ~ '/Name') | quote))
         if coolify_root_ref else '') }}
coolify_root_email: >-
  {{ lookup('env', 'COOLIFY_ROOT_EMAIL')
     or (lookup('ansible.builtin.pipe', 'op read ' ~ ((coolify_root_ref ~ '/username') | quote))
         if coolify_root_ref else '') }}
coolify_root_password: >-
  {{ lookup('env', 'COOLIFY_ROOT_PASSWORD')
     or (lookup('ansible.builtin.pipe', 'op read ' ~ ((coolify_root_ref ~ '/password') | quote))
         if coolify_root_ref else '') }}
github_runner_token: >-
  {{ lookup('env', 'GITHUB_RUNNER_TOKEN')
     or (lookup('ansible.builtin.pipe', 'op read ' ~ (github_runner_token_ref | quote))
         if github_runner_token_ref else '') }}

# ---------------------------------------------------------------------------
# GitHub Actions runner (optional, off by default)
#
# Self-hosted runners for your PRIVATE repositories, so their jobs run here
# instead of using GitHub's minutes. Each job gets a fresh container that is
# discarded afterwards. Public repositories are refused when the runner
# registers, every time (README, GitHub Actions runner).
# ---------------------------------------------------------------------------
github_runner_enabled: false

#   repo  one set of runners per repository in github_runner_repos. The only
#         choice for repositories under a personal account.
#   org   one set of runners for the organization github_runner_org, in a
#         runner group that does not allow public repositories.
github_runner_scope: repo
github_runner_repos: []       # owner/name, private only
github_runner_org: ""

# Runners per repository (scope repo) or for the organization (scope org).
# Each one takes a single job at a time.
github_runner_instances: 1

# Workflows pick the runner with `runs-on: [self-hosted, preview-host]`.
github_runner_labels: [self-hosted, linux, x64, preview-host]

# Several runners per repository, each with labels of its own (README, Several
# runners per repository). Empty: github_runner_repos and
# github_runner_instances, all with github_runner_labels. Each entry:
#   repo        owner/name, private only (scope repo)
#   name        heavy, light...: lowercase letters, digits and _
#   labels      capability labels added to github_runner_labels, e.g. [ci-light]
#   instances   runners of this entry (default 1)
#   cpu_quota   optional limit of this entry's jobs, e.g. 50% (half a core)
#   memory_max  optional limit, e.g. 2G
# All of them stay within github_runner_cpu_quota and github_runner_memory_max.
github_runners: []

# Limits shared by all runners and their jobs together, so the previews keep
# running. CPU in percent of one core (200% = two cores). Under contention the
# runners also get half the CPU and disk weight of everything else.
github_runner_cpu_quota: 200%
github_runner_memory_max: 4G
github_runner_tasks_max: 4096

# A job only starts while the disk has this much free space (GB).
github_runner_min_free_disk_gb: 20

# Each runner's tool cache (setup-node, setup-python...) is emptied before a
# job past this size (GB). It is the one thing a job leaves for the next, so
# 0, emptied every time, is the strict mode. That is the default with org,
# where one runner serves every repository of the organization (README, Runner
# security).
github_runner_tool_cache_max_gb: "{{ 0 if github_runner_scope == 'org' else 5 }}"

# Give jobs their own Docker daemon (Docker in Docker, privileged) for image
# builds, service containers and `container:` jobs. They never get the host's.
github_runner_docker: true

# ---------------------------------------------------------------------------
# Remote host (ci-1)
#
# The machine in the `ci` group of inventory/hosts.yml (README, Remote host
# (ci-1)): reachable only through the tailnet, security updates, swap, and
# never idle for Oracle. This repository is public, so its address goes in
# local.yml: its Tailscale address or MagicDNS name. Empty skips the host.
# ---------------------------------------------------------------------------
ci_host_address: ""
ci_host_user: ubuntu

# When an update needs a reboot, the host reboots at this time of its own
# clock: UTC on Oracle's images, so 07:30 is 04:30 in Brasília.
ci_host_reboot_time: "07:30"

ci_host_swap_mb: 4096

# memory-floor holds memory until this much of the host's memory is in use,
# and gives it back as the real load grows. Oracle reclaims an Always Free
# instance whose CPU, network and memory all stay below 20%.
ci_host_memory_floor_percent: 30

# Warn when the use stays below this percent for this many seconds anyway.
# The warning goes to ntfy: the topic is a secret, so it goes in local.yml.
# Empty only logs it (journalctl -u memory-floor).
ci_host_memory_alert_percent: 20
ci_host_memory_alert_after: 3600
ci_host_ntfy_url: https://ntfy.sh
ci_host_ntfy_topic: ""

# GitHub Actions runners on ci-1 (README, Runner on ci-1): the same
# github_runner role and token as the preview host, with settings of their
# own, so turning one host's runners on or off leaves the other's alone. The
# github_runner_* settings not listed here (token, image, Docker in Docker,
# tool cache) apply to both hosts.
ci_host_runner_enabled: false
ci_host_runner_scope: repo
ci_host_runner_repos: []          # owner/name, private only
ci_host_runner_org: ""
ci_host_runner_instances: 1

# ci-1 is ARM (aarch64): jobs, and the images they build, are linux/arm64.
# Workflows pick it with `runs-on: [self-hosted, ARM64, ci-1]`.
ci_host_runner_labels: [self-hosted, linux, ARM64, ci-1]

# Several runners per repository on ci-1, as github_runners (README, Several
# runners per repository). Each one carries ci_host_runner_labels as well.
ci_host_runners: []

# ci-1 has 2 cores and 12 GB, and nothing else heavy runs on it yet: the
# runners get both cores and 8 GB, and leave 4 GB to the system and Docker.
ci_host_runner_cpu_quota: 200%
ci_host_runner_memory_max: 8G
ci_host_runner_min_free_disk_gb: 20

# ---------------------------------------------------------------------------
# PR previews on ci-1 (README, Previews on ci-1)
#
# The Coolify of the preview host builds and runs the PR previews of some
# apps on ci-1, a remote server it reaches over SSH through the tailnet, and
# ci-1 publishes them through a Cloudflare tunnel of its own. No PR code runs
# on the preview host. Production stays where it is.
# ---------------------------------------------------------------------------
ci_previews_enabled: false

# The zones whose PR previews ci-1 serves: `domain` and/or zones of
# preview_zones. Their wildcard moves from the preview host's tunnel to
# ci-1's, and ci-1 answers only for PR previews there (pr-<n>.<zone> and
# pr-<n>-<name>.<zone>): any other name gets 403. Whatever else the preview
# host serves on such a zone goes in production_hostnames first, which keeps
# a route and a DNS record of its own here.
#
# On a tailnet-only zone (preview_zones, `tailnet: true`) ci-1 uses no tunnel:
# the wildcard is an unproxied A record to ci-1's tailnet address, Tailscale
# Serve hands port 443 there to Traefik, and Traefik serves a *.<zone>
# certificate it gets through Cloudflare DNS-01 (ci_previews_dns_token_file).
# With only such zones, ci-1 runs no cloudflared at all.
ci_previews_zones: []

# ci-1's own Cloudflare API token for DNS-01, restricted to its tailnet-only
# zones, in a file you put on ci-1 yourself (README, Tailnet-only zones):
# root-owned, mode 0600, the token alone. The playbook checks that it exists
# and never reads it. Needed when ci_previews_zones has a tailnet-only zone.
ci_previews_dns_token_file: /etc/preview-infra/cloudflare-dns-token

# The hosts ci-1 serves on each of those zones: this regular expression,
# followed by the zone.
ci_previews_host_pattern: '^pr-[0-9]+(-[a-z0-9]+)*\.'

# ci-1's own tunnel. Never the preview host's: two hosts on one tunnel split
# its traffic between them.
ci_previews_tunnel_name: ci-1-previews

# ci-1 as the server is named in Coolify (Servers → + Add).
ci_previews_coolify_server: ci-1

# Coolify logs in to ci-1 as root, with a key, from the preview host's
# tailnet address only (`tailscale ip -4` on the preview host). The key is the
# public half of the private key ci-1 has in Coolify (Keys & Tokens).
ci_previews_coolify_address: ""
ci_previews_coolify_key: ""

# One Docker network per app on ci-1, its Coolify destination: an entry
# `luotsi` makes the network previews-luotsi on the bridge pv-luotsi (at most
# 12 characters: a-z, 0-9, -). A preview reaches its own network and the
# internet; never the host, the tailnet, the runners' networks or another
# app's previews (README, Previews on ci-1).
ci_previews_networks: []

# Each preview's limits, unless its coolify_apps entry sets cpus or memory.
# Coolify applies them to every preview of the app. No swap.
ci_previews_cpus: "1"
ci_previews_memory: 1g

# At most this many previews run on ci-1 at once, all apps together. Past it,
# preview-limit stops the ones deployed longest ago; pushing to their PR (or
# Redeploy in Coolify) starts them again.
ci_previews_max: 3

# Builds at once on ci-1 (Coolify's Concurrent Builds for that server).
ci_previews_concurrent_builds: 1
