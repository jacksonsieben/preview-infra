---
# One host runs Coolify and the tunnel. Point this at whichever machine is the
# preview host today; moving it is a matter of changing this file and rerunning.
all:
  children:
    preview:
      hosts:
        preview-host:
          ansible_connection: local
        # A remote machine instead:
        # preview-host:
        #   ansible_host: 192.168.1.50
        #   ansible_user: you
