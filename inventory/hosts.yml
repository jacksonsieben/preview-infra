---
# One host runs Coolify and the tunnel. Point this at whichever machine is the
# preview host today; moving it is a matter of changing this file and rerunning.
all:
  children:
    preview:
      hosts:
        preview-host:
          ansible_connection: local
        # A remote machine instead:
        # preview-host:
        #   ansible_host: 192.168.1.50
        #   ansible_user: you
    # The remote host, reached through the tailnet (README, Remote host
    # (ci-1)). This repository is public: its address is ci_host_address in
    # group_vars/all/local.yml, and the play skips it while that is empty.
    ci:
      hosts:
        ci-1:
          ansible_host: "{{ ci_host_address }}"
          ansible_user: "{{ ci_host_user }}"
